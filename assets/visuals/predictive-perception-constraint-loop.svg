<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc"><title id="title">Predictive perception constraint loop</title><desc id="desc">Prior expectations and sensory input meet in a perceptual estimate; prediction error updates the model while action samples the external world again.</desc><rect width="1200" height="680" rx="28" fill="#081417"/><defs><linearGradient id="g" x1="0" x2="1"><stop stop-color="#71f5cc"/><stop offset="1" stop-color="#4cc9ff"/></linearGradient><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0L10 3L0 6Z" fill="#5edfd1"/></marker></defs><g font-family="system-ui,sans-serif"><text x="68" y="66" fill="#9bb2b6" font-size="18" letter-spacing="5">PERCEPTION AS A CONSTRAINT LOOP</text><text x="68" y="108" fill="#effdf9" font-size="27" font-weight="700">A model proposes. The world retains a vote.</text><g transform="translate(68 178)"><rect width="270" height="150" rx="20" fill="#10282b" stroke="#27565a"/><text x="24" y="42" fill="#71f5cc" font-size="14" letter-spacing="2">PRIOR MODEL</text><text x="24" y="82" fill="#fff" font-size="22" font-weight="700">Context + learning</text><text x="24" y="116" fill="#a9bec1" font-size="15">What is likely here?</text></g><g transform="translate(68 390)"><rect width="270" height="150" rx="20" fill="#10282b" stroke="#27565a"/><text x="24" y="42" fill="#71f5cc" font-size="14" letter-spacing="2">SENSORY INPUT</text><text x="24" y="82" fill="#fff" font-size="22" font-weight="700">Light + sound + body</text><text x="24" y="116" fill="#a9bec1" font-size="15">What arrived now?</text></g><g transform="translate(462 270)"><rect width="276" height="178" rx="22" fill="#14363a" stroke="#5edfd1"/><text x="138" y="48" text-anchor="middle" fill="#71f5cc" font-size="14" letter-spacing="2">PERCEPTUAL ESTIMATE</text><text x="138" y="96" text-anchor="middle" fill="#fff" font-size="25" font-weight="700">Best current fit</text><text x="138" y="132" text-anchor="middle" fill="#b9d1d2" font-size="15">Weighted by uncertainty</text></g><g transform="translate(862 178)"><rect width="270" height="150" rx="20" fill="#0d2023" stroke="#355e62"/><text x="24" y="42" fill="#71f5cc" font-size="14" letter-spacing="2">PREDICTION ERROR</text><text x="24" y="82" fill="#fff" font-size="22" font-weight="700">What did not fit?</text><text x="24" y="116" fill="#a9bec1" font-size="15">Revise model or precision</text></g><g transform="translate(862 390)"><rect width="270" height="150" rx="20" fill="#0d2023" stroke="#355e62"/><text x="24" y="42" fill="#71f5cc" font-size="14" letter-spacing="2">ACTION</text><text x="24" y="82" fill="#fff" font-size="22" font-weight="700">Sample again</text><text x="24" y="116" fill="#a9bec1" font-size="15">Move · look · measure</text></g><path d="M338 253H445M338 465H445M755 325H845M997 345V375" fill="none" stroke="url(#g)" stroke-width="4" marker-end="url(#a)"/><path d="M862 465H790V565H205V555" fill="none" stroke="#5edfd1" stroke-width="3" marker-end="url(#a)"/><path d="M862 253H790V145H205V165" fill="none" stroke="#5edfd1" stroke-width="3" marker-end="url(#a)"/></g><rect x="68" y="610" width="1064" height="1" fill="#234448"/><text x="68" y="646" fill="#6e898c" font-family="system-ui,sans-serif" font-size="15">Life in the Simulation · original editorial diagram · conceptual model, not a literal neural circuit</text></svg>