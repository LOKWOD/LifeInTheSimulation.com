<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc"><title id="title">AI memory control layers</title><desc id="desc">Five separate layers show current chat context, saved profile memory, past-chat reference, project knowledge and provider data controls.</desc><rect width="1200" height="680" rx="28" fill="#081417"/><defs><linearGradient id="g" x1="0" x2="1"><stop stop-color="#71f5cc"/><stop offset="1" stop-color="#4cc9ff"/></linearGradient></defs><g font-family="system-ui,sans-serif"><text x="68" y="66" fill="#9bb2b6" font-size="18" letter-spacing="5">AI MEMORY CONTROL LAYERS</text><text x="68" y="108" fill="#effdf9" font-size="27" font-weight="700">One friendly word. Five different stores and controls.</text><g transform="translate(110 160)"><rect width="980" height="76" rx="18" fill="#14363a" stroke="#5edfd1"/><text x="28" y="31" fill="#71f5cc" font-size="13" letter-spacing="2">1 · CURRENT CHAT CONTEXT</text><text x="28" y="57" fill="#fff" font-size="19" font-weight="700">Messages and files available in this conversation</text></g><g transform="translate(150 250)"><rect width="900" height="76" rx="18" fill="#10282b" stroke="#2c5a5e"/><text x="28" y="31" fill="#71f5cc" font-size="13" letter-spacing="2">2 · SAVED PROFILE MEMORY</text><text x="28" y="57" fill="#fff" font-size="19" font-weight="700">Selected facts, preferences and ongoing goals</text></g><g transform="translate(190 340)"><rect width="820" height="76" rx="18" fill="#10282b" stroke="#2c5a5e"/><text x="28" y="31" fill="#71f5cc" font-size="13" letter-spacing="2">3 · PAST-CHAT REFERENCE</text><text x="28" y="57" fill="#fff" font-size="19" font-weight="700">Retrieved or summarized continuity from earlier chats</text></g><g transform="translate(230 430)"><rect width="740" height="76" rx="18" fill="#0d2023" stroke="#355e62"/><text x="28" y="31" fill="#71f5cc" font-size="13" letter-spacing="2">4 · PROJECT KNOWLEDGE</text><text x="28" y="57" fill="#fff" font-size="19" font-weight="700">Bounded instructions, files and grouped conversations</text></g><g transform="translate(270 520)"><rect width="660" height="76" rx="18" fill="#0d2023" stroke="#355e62"/><text x="28" y="31" fill="#71f5cc" font-size="13" letter-spacing="2">5 · PROVIDER DATA CONTROLS</text><text x="28" y="57" fill="#fff" font-size="19" font-weight="700">Retention, activity, review and model improvement</text></g></g><text x="68" y="642" fill="#6e898c" font-family="system-ui,sans-serif" font-size="15">Life in the Simulation · original editorial diagram · conceptual product-control model, checked 30 Aug 2026</text></svg>