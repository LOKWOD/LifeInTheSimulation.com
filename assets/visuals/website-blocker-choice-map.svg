<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc"><title id="title">Website blocker choice map</title><desc id="desc">A decision map compares no-buy friction, Apple Screen Time, Cold Turkey and Freedom by device coverage and required resistance to bypass.</desc><rect width="1200" height="680" rx="28" fill="#081417"/><defs><linearGradient id="g" x1="0" x2="1"><stop stop-color="#71f5cc"/><stop offset="1" stop-color="#4cc9ff"/></linearGradient><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0L10 3L0 6Z" fill="#5edfd1"/></marker></defs><g font-family="system-ui,sans-serif"><text x="68" y="66" fill="#9bb2b6" font-size="18" letter-spacing="5">WEBSITE BLOCKER CHOICE MAP</text><text x="68" y="108" fill="#effdf9" font-size="27" font-weight="700">Block the real escape route—not the imaginary one.</text><g transform="translate(390 145)"><rect width="420" height="100" rx="20" fill="#14363a" stroke="#5edfd1"/><text x="210" y="40" text-anchor="middle" fill="#71f5cc" font-size="14" letter-spacing="2">START WITH THE BYPASS</text><text x="210" y="73" text-anchor="middle" fill="#fff" font-size="22" font-weight="700">Which device wins when focus fails?</text></g><path d="M600 260V320M600 320H190V355M600 320H465V355M600 320H735V355M600 320H1010V355" fill="none" stroke="#5edfd1" stroke-width="3" marker-end="url(#a)"/><g transform="translate(68 365)"><rect width="244" height="175" rx="18" fill="#10282b" stroke="#27565a"/><text x="22" y="40" fill="#71f5cc" font-size="14" letter-spacing="2">NO-BUY</text><text x="22" y="78" fill="#fff" font-size="21" font-weight="700">Unproven need</text><text x="22" y="110" fill="#a9bec1" font-size="15">Move phone · work profile</text><text x="22" y="140" fill="#789699" font-size="14">Lowest setup cost</text></g><g transform="translate(338 365)"><rect width="244" height="175" rx="18" fill="#10282b" stroke="#27565a"/><text x="22" y="40" fill="#71f5cc" font-size="14" letter-spacing="2">SCREEN TIME</text><text x="22" y="78" fill="#fff" font-size="21" font-weight="700">Apple ecosystem</text><text x="22" y="110" fill="#a9bec1" font-size="15">Built in · passcode</text><text x="22" y="140" fill="#789699" font-size="14">Moderate enforcement</text></g><g transform="translate(608 365)"><rect width="244" height="175" rx="18" fill="#10282b" stroke="#27565a"/><text x="22" y="40" fill="#71f5cc" font-size="14" letter-spacing="2">COLD TURKEY</text><text x="22" y="78" fill="#fff" font-size="21" font-weight="700">Windows or Mac</text><text x="22" y="110" fill="#a9bec1" font-size="15">Strong local block</text><text x="22" y="140" fill="#789699" font-size="14">One work machine</text></g><g transform="translate(878 365)"><rect width="254" height="175" rx="18" fill="#10282b" stroke="#27565a"/><text x="22" y="40" fill="#71f5cc" font-size="14" letter-spacing="2">FREEDOM</text><text x="22" y="78" fill="#fff" font-size="21" font-weight="700">Several platforms</text><text x="22" y="110" fill="#a9bec1" font-size="15">Synced schedules</text><text x="22" y="140" fill="#789699" font-size="14">Check OS loopholes</text></g></g><rect x="210" y="585" width="780" height="55" rx="16" fill="url(#g)" opacity=".14" stroke="#61e5d3"/><text x="600" y="619" text-anchor="middle" fill="#effdf9" font-family="system-ui,sans-serif" font-size="18" font-weight="700">Rehearse exceptions before increasing lock strength.</text><text x="68" y="660" fill="#6e898c" font-family="system-ui,sans-serif" font-size="15">Life in the Simulation · original editorial diagram · no product images or logos</text></svg>