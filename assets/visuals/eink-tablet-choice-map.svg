<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc"><title id="title">E-ink writing tablet choice map</title><desc id="desc">Four choices based on whether the workflow requires no new device, focused color annotation, handwriting and offline control, or Android apps and file flexibility.</desc><rect width="1200" height="620" fill="#0b0e15"/><text x="60" y="64" fill="#8af4cb" font-family="monospace" font-size="22" letter-spacing="4">CHOOSE THE SMALLEST SYSTEM THAT WORKS</text><text x="60" y="104" fill="#94a0af" font-family="system-ui" font-size="20">Start with the recurring job. Capability is not the same thing as fit.</text><g font-family="system-ui"><rect x="60" y="145" width="520" height="175" rx="18" fill="#121925" stroke="#334052"/><text x="90" y="188" fill="#94a0af" font-family="monospace" font-size="17" letter-spacing="2">WORKFLOW STILL UNDEFINED</text><text x="90" y="237" fill="#f2f5f7" font-size="30" font-weight="700">Buy nothing yet</text><text x="90" y="276" fill="#c7ced7" font-size="19">Use paper + a device you own. Record actual failures.</text><rect x="620" y="145" width="520" height="175" rx="18" fill="#121925" stroke="#a997ff"/><text x="650" y="188" fill="#a997ff" font-family="monospace" font-size="17" letter-spacing="2">FOCUS + COLOR ANNOTATION</text><text x="650" y="237" fill="#f2f5f7" font-size="30" font-weight="700">reMarkable Paper Pro</text><text x="650" y="276" fill="#c7ced7" font-size="19">Large PDFs, restrained software, front-lit color.</text><rect x="60" y="350" width="520" height="175" rx="18" fill="#121925" stroke="#8af4cb"/><text x="90" y="393" fill="#8af4cb" font-family="monospace" font-size="17" letter-spacing="2">HANDWRITING + OFFLINE CONTROL</text><text x="90" y="442" fill="#f2f5f7" font-size="30" font-weight="700">Supernote Manta</text><text x="90" y="481" fill="#c7ced7" font-size="18">Structured notes, no front light, maintainable hardware.</text><rect x="620" y="350" width="520" height="175" rx="18" fill="#121925" stroke="#ffd18a"/><text x="650" y="393" fill="#ffd18a" font-family="monospace" font-size="17" letter-spacing="2">APPS + FILE FLEXIBILITY</text><text x="650" y="442" fill="#f2f5f7" font-size="30" font-weight="700">BOOX Note Air5 C</text><text x="650" y="481" fill="#c7ced7" font-size="18">Android apps, broad formats, expandable storage.</text></g><line x1="60" y1="566" x2="1140" y2="566" stroke="#222b39"/><text x="60" y="598" fill="#94a0af" font-family="system-ui" font-size="18">No product photos: this compares documented workflows, not cosmetic design.</text></svg>