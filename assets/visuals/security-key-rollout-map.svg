<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc"><title id="title">Hardware security key rollout map</title><desc id="desc">A five-step map starts with account support and connector compatibility, compares a platform passkey with a FIDO-only or multi-protocol key, then requires two enrolled keys, offline recovery codes and a tested sign-in.</desc><rect width="1200" height="680" rx="28" fill="#081417"/><defs><linearGradient id="g" x1="0" x2="1"><stop stop-color="#71f5cc"/><stop offset="1" stop-color="#4cc9ff"/></linearGradient><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0L10 3L0 6Z" fill="#5edfd1"/></marker></defs><text x="68" y="65" fill="#9bb2b6" font-family="system-ui,sans-serif" font-size="18" letter-spacing="5">HARDWARE SECURITY KEY ROLLOUT</text><text x="68" y="108" fill="#effdf9" font-family="system-ui,sans-serif" font-size="25" font-weight="700">The purchase only works when compatibility and recovery are finished.</text><g font-family="system-ui,sans-serif"><g transform="translate(68 165)"><rect width="200" height="150" rx="18" fill="#10282b" stroke="#27565a"/><text x="20" y="40" fill="#71f5cc" font-size="14" letter-spacing="2">01 · SUPPORT</text><text x="20" y="78" fill="#fff" font-size="21" font-weight="700">List accounts</text><text x="20" y="108" fill="#a9bec1" font-size="15">Verify FIDO per service.</text></g><g transform="translate(286 165)"><rect width="200" height="150" rx="18" fill="#10282b" stroke="#27565a"/><text x="20" y="40" fill="#71f5cc" font-size="14" letter-spacing="2">02 · CONNECT</text><text x="20" y="78" fill="#fff" font-size="21" font-weight="700">Map devices</text><text x="20" y="108" fill="#a9bec1" font-size="15">USB-C · USB-A · NFC</text></g><g transform="translate(504 165)"><rect width="200" height="150" rx="18" fill="#14363a" stroke="#5edfd1"/><text x="20" y="40" fill="#71f5cc" font-size="14" letter-spacing="2">03 · CHOOSE</text><text x="20" y="78" fill="#fff" font-size="21" font-weight="700">Buy—or wait</text><text x="20" y="108" fill="#a9bec1" font-size="15">Passkey · FIDO · multi</text></g><g transform="translate(722 165)"><rect width="200" height="150" rx="18" fill="#10282b" stroke="#27565a"/><text x="20" y="40" fill="#71f5cc" font-size="14" letter-spacing="2">04 · ENROLL</text><text x="20" y="78" fill="#fff" font-size="21" font-weight="700">Primary + spare</text><text x="20" y="108" fill="#a9bec1" font-size="15">Store them separately.</text></g><g transform="translate(940 165)"><rect width="192" height="150" rx="18" fill="#10282b" stroke="#27565a"/><text x="20" y="40" fill="#71f5cc" font-size="14" letter-spacing="2">05 · TEST</text><text x="20" y="78" fill="#fff" font-size="21" font-weight="700">Fresh sign-in</text><text x="20" y="108" fill="#a9bec1" font-size="15">Test both before trust.</text></g><path d="" stroke="url(#g)" stroke-width="4" marker-end="url(#a)"/><g transform="translate(148 400)"><rect width="260" height="105" rx="16" fill="#0d2023" stroke="#355e62"/><text x="130" y="40" text-anchor="middle" fill="#effdf9" font-size="21" font-weight="700">Platform passkey</text><text x="130" y="70" text-anchor="middle" fill="#a9bec1" font-size="15">Convenience + syncable recovery</text></g><g transform="translate(470 400)"><rect width="260" height="105" rx="16" fill="#0d2023" stroke="#355e62"/><text x="130" y="40" text-anchor="middle" fill="#effdf9" font-size="21" font-weight="700">FIDO-only key</text><text x="130" y="70" text-anchor="middle" fill="#a9bec1" font-size="15">Ordinary supported web accounts</text></g><g transform="translate(792 400)"><rect width="260" height="105" rx="16" fill="#0d2023" stroke="#355e62"/><text x="130" y="40" text-anchor="middle" fill="#effdf9" font-size="21" font-weight="700">Multi-protocol key</text><text x="130" y="70" text-anchor="middle" fill="#a9bec1" font-size="15">Only for named extra requirements</text></g><path d="M278 385L564 318M600 385V318M922 385L636 318" fill="none" stroke="#416d72" stroke-width="3" stroke-dasharray="8 8"/></g><rect x="230" y="555" width="740" height="72" rx="16" fill="url(#g)" opacity=".15" stroke="#61e5d3"/><text x="600" y="585" text-anchor="middle" fill="#effdf9" font-family="system-ui,sans-serif" font-size="19" font-weight="700">Every path ends with offline recovery codes and a written loss procedure.</text><text x="600" y="612" text-anchor="middle" fill="#b9d1d2" font-family="system-ui,sans-serif" font-size="15">Life in the Simulation · original editorial diagram · no product images or logos</text></svg>