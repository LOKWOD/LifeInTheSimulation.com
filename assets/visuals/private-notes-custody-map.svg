<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc"><title id="title">Private notes custody map</title><desc id="desc">A decision map routes notes by sensitivity, collaboration and recovery needs toward paper, local files, managed encrypted sync or configurable open-source sync.</desc><rect width="1200" height="680" rx="28" fill="#081417"/><defs><linearGradient id="g" x1="0" x2="1"><stop stop-color="#71f5cc"/><stop offset="1" stop-color="#4cc9ff"/></linearGradient><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0L10 3L0 6Z" fill="#5edfd1"/></marker></defs><text x="68" y="66" fill="#9bb2b6" font-family="system-ui,sans-serif" font-size="18" letter-spacing="5">PRIVATE NOTES CUSTODY MAP</text><text x="68" y="110" fill="#effdf9" font-family="system-ui,sans-serif" font-size="26" font-weight="700">Choose where the note lives before choosing how the app feels.</text><g font-family="system-ui,sans-serif"><g transform="translate(390 150)"><rect width="420" height="105" rx="20" fill="#14363a" stroke="#5edfd1"/><text x="210" y="42" text-anchor="middle" fill="#71f5cc" font-size="14" letter-spacing="2">START WITH THE NOTE</text><text x="210" y="76" text-anchor="middle" fill="#fff" font-size="22" font-weight="700">Sensitivity · sharing · recovery</text></g><path d="M600 270V330M600 330H190V365M600 330H465V365M600 330H735V365M600 330H1010V365" fill="none" stroke="#5edfd1" stroke-width="3" marker-end="url(#a)"/><g transform="translate(68 375)"><rect width="244" height="170" rx="18" fill="#10282b" stroke="#27565a"/><text x="22" y="40" fill="#71f5cc" font-size="14" letter-spacing="2">PAPER</text><text x="22" y="78" fill="#fff" font-size="21" font-weight="700">Physical custody</text><text x="22" y="110" fill="#a9bec1" font-size="15">No network · no search</text><text x="22" y="138" fill="#789699" font-size="14">Loss is physical.</text></g><g transform="translate(338 375)"><rect width="244" height="170" rx="18" fill="#10282b" stroke="#27565a"/><text x="22" y="40" fill="#71f5cc" font-size="14" letter-spacing="2">LOCAL FILES</text><text x="22" y="78" fill="#fff" font-size="21" font-weight="700">Legible custody</text><text x="22" y="110" fill="#a9bec1" font-size="15">Portable Markdown</text><text x="22" y="138" fill="#789699" font-size="14">You choose sync.</text></g><g transform="translate(608 375)"><rect width="244" height="170" rx="18" fill="#10282b" stroke="#27565a"/><text x="22" y="40" fill="#71f5cc" font-size="14" letter-spacing="2">MANAGED E2EE</text><text x="22" y="78" fill="#fff" font-size="21" font-weight="700">Lower setup</text><text x="22" y="110" fill="#a9bec1" font-size="15">Account-backed sync</text><text x="22" y="138" fill="#789699" font-size="14">Test recovery.</text></g><g transform="translate(878 375)"><rect width="254" height="170" rx="18" fill="#10282b" stroke="#27565a"/><text x="22" y="40" fill="#71f5cc" font-size="14" letter-spacing="2">CONFIGURABLE E2EE</text><text x="22" y="78" fill="#fff" font-size="21" font-weight="700">More provider choice</text><text x="22" y="110" fill="#a9bec1" font-size="15">More states to maintain</text><text x="22" y="138" fill="#789699" font-size="14">Verify every device.</text></g></g><rect x="194" y="586" width="812" height="56" rx="16" fill="url(#g)" opacity=".14" stroke="#61e5d3"/><text x="600" y="620" text-anchor="middle" fill="#effdf9" font-family="system-ui,sans-serif" font-size="18" font-weight="700">Every digital path ends with an export you opened and a restore you tested.</text><text x="68" y="660" fill="#6e898c" font-family="system-ui,sans-serif" font-size="15">Life in the Simulation · original editorial diagram · no product images or logos</text></svg>