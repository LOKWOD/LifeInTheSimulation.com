<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc"><title id="title">Dream evidence filter</title><desc id="desc">A vivid dream supports a claim about experience but not a claim that waking reality is simulated.</desc><rect width="1200" height="520" fill="#0b0e15"/><text x="70" y="70" fill="#8af4cb" font-family="monospace" font-size="22" letter-spacing="4">FROM EXPERIENCE TO CLAIM</text><text x="70" y="112" fill="#94a0af" font-family="system-ui" font-size="20">What the observation can carry — and where the evidence stops.</text><g font-family="system-ui"><rect x="70" y="155" width="290" height="245" rx="18" fill="#121925" stroke="#334052"/><text x="100" y="202" fill="#8af4cb" font-family="monospace" font-size="17" letter-spacing="2">OBSERVATION</text><text x="100" y="257" fill="#f2f5f7" font-size="28" font-weight="700"><tspan x="100">The dream felt</tspan><tspan x="100" dy="36">like a world.</tspan></text><text x="100" y="348" fill="#94a0af" font-size="19">A report about experience.</text><path d="M380 276h55" stroke="#8af4cb" stroke-width="4"/><path d="m423 264 14 12-14 12" fill="none" stroke="#8af4cb" stroke-width="4"/><rect x="455" y="155" width="290" height="245" rx="18" fill="#121925" stroke="#8af4cb"/><text x="485" y="202" fill="#8af4cb" font-family="monospace" font-size="17" letter-spacing="2">SUPPORTED INFERENCE</text><text x="485" y="250" fill="#f2f5f7" font-size="26" font-weight="700"><tspan x="485">Experience can</tspan><tspan x="485" dy="32">misrepresent</tspan><tspan x="485" dy="32">context.</tspan></text><text x="485" y="366" fill="#94a0af" font-size="19">A claim about minds.</text><path d="M765 276h55" stroke="#ffd18a" stroke-width="4" stroke-dasharray="8 8"/><path d="m808 264 14 12-14 12" fill="none" stroke="#ffd18a" stroke-width="4"/><rect x="840" y="155" width="290" height="245" rx="18" fill="#17151a" stroke="#ffd18a"/><text x="870" y="202" fill="#ffd18a" font-family="monospace" font-size="17" letter-spacing="2">UNSUPPORTED LEAP</text><text x="870" y="257" fill="#f2f5f7" font-size="28" font-weight="700"><tspan x="870">Waking reality</tspan><tspan x="870" dy="36">is simulated.</tspan></text><text x="870" y="344" fill="#94a0af" font-size="19"><tspan x="870">A claim about</tspan><tspan x="870" dy="26">the universe.</tspan></text></g><line x1="70" y1="448" x2="1130" y2="448" stroke="#222b39"/><text x="70" y="486" fill="#c7ced7" font-family="system-ui" font-size="19">Vividness supports the observation. It does not identify the substrate.</text></svg>