<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc"><title id="title">Free will claim map</title><desc id="desc">The measured sequence of readiness potential, reported urge and movement is separated from larger interpretations about a completed decision, conscious causation and free will.</desc><rect width="1200" height="680" rx="28" fill="#081417"/><defs><linearGradient id="g" x1="0" x2="1"><stop stop-color="#71f5cc"/><stop offset="1" stop-color="#4cc9ff"/></linearGradient><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0L10 3L0 6Z" fill="#5edfd1"/></marker></defs><text x="68" y="66" fill="#9bb2b6" font-family="system-ui,sans-serif" font-size="18" letter-spacing="5">FROM MEASUREMENT TO CLAIM</text><text x="68" y="108" fill="#effdf9" font-family="system-ui,sans-serif" font-size="27" font-weight="700">A measured sequence is not a complete theory of agency.</text><g font-family="system-ui,sans-serif"><text x="68" y="163" fill="#71f5cc" font-size="14" letter-spacing="2">MEASURED IN THE TASK</text><g transform="translate(68 185)"><rect width="260" height="138" rx="18" fill="#10282b" stroke="#27565a"/><text x="24" y="42" fill="#71f5cc" font-size="14" letter-spacing="2">01 · EEG</text><text x="24" y="80" fill="#fff" font-size="20" font-weight="700">Readiness potential</text><text x="24" y="110" fill="#a9bec1" font-size="15">Averaged neural signal</text></g><g transform="translate(392 185)"><rect width="260" height="138" rx="18" fill="#10282b" stroke="#27565a"/><text x="24" y="42" fill="#71f5cc" font-size="14" letter-spacing="2">02 · REPORT</text><text x="24" y="80" fill="#fff" font-size="22" font-weight="700">Remembered urge</text><text x="24" y="110" fill="#a9bec1" font-size="15">Clock-position judgment</text></g><g transform="translate(716 185)"><rect width="260" height="138" rx="18" fill="#10282b" stroke="#27565a"/><text x="24" y="42" fill="#71f5cc" font-size="14" letter-spacing="2">03 · ACTION</text><text x="24" y="80" fill="#fff" font-size="22" font-weight="700">Simple movement</text><text x="24" y="110" fill="#a9bec1" font-size="15">Arbitrary timing task</text></g><path d="M328 254H378M652 254H702" stroke="url(#g)" stroke-width="4" marker-end="url(#a)"/><path d="M990 254H1105V410" fill="none" stroke="#5edfd1" stroke-width="3" marker-end="url(#a)"/><text x="68" y="388" fill="#71f5cc" font-size="14" letter-spacing="2">ADDITIONAL ASSUMPTIONS REQUIRED</text><g transform="translate(68 410)"><rect width="310" height="144" rx="18" fill="#0d2023" stroke="#355e62"/><text x="24" y="43" fill="#fff" font-size="21" font-weight="700">Signal = decision?</text><text x="24" y="78" fill="#a9bec1" font-size="15">Preparation, threshold, urge</text><text x="24" y="105" fill="#a9bec1" font-size="15">or completed choice?</text></g><g transform="translate(445 410)"><rect width="310" height="144" rx="18" fill="#0d2023" stroke="#355e62"/><text x="24" y="43" fill="#fff" font-size="21" font-weight="700">Report = awareness?</text><text x="24" y="78" fill="#a9bec1" font-size="15">One timestamp for a process</text><text x="24" y="105" fill="#a9bec1" font-size="15">that may unfold over time?</text></g><g transform="translate(822 410)"><rect width="310" height="144" rx="18" fill="#14363a" stroke="#5edfd1"/><text x="24" y="43" fill="#fff" font-size="21" font-weight="700">Task = free will?</text><text x="24" y="78" fill="#a9bec1" font-size="15">Does arbitrary movement model</text><text x="24" y="105" fill="#a9bec1" font-size="15">reasoned choice and control?</text></g></g><rect x="68" y="607" width="1064" height="1" fill="#234448"/><text x="68" y="642" fill="#6e898c" font-family="system-ui,sans-serif" font-size="15">Life in the Simulation · original editorial diagram · conceptual map, not recorded EEG data</text></svg>