<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc"><title id="title">Emergence explanation ladder</title><desc id="desc">Components and interactions lead through constraints to a higher-level pattern, then to predictions and failure conditions.</desc><rect width="1200" height="680" rx="28" fill="#081417"/><defs><linearGradient id="g" x1="0" x2="1"><stop stop-color="#71f5cc"/><stop offset="1" stop-color="#4cc9ff"/></linearGradient><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0L10 3L0 6Z" fill="#5edfd1"/></marker></defs><g font-family="system-ui,sans-serif"><text x="68" y="66" fill="#9bb2b6" font-size="18" letter-spacing="5">THE EMERGENCE EXPLANATION LADDER</text><text x="68" y="108" fill="#effdf9" font-size="27" font-weight="700">Naming the pattern is step three—not the finish.</text><g transform="translate(68 185)"><rect width="250" height="120" rx="19" fill="#10282b" stroke="#27565a"/><text x="24" y="40" fill="#71f5cc" font-size="14" letter-spacing="2">1 · COMPONENTS</text><text x="24" y="79" fill="#fff" font-size="21" font-weight="700">Parts + states</text></g><g transform="translate(475 185)"><rect width="250" height="120" rx="19" fill="#10282b" stroke="#27565a"/><text x="24" y="40" fill="#71f5cc" font-size="14" letter-spacing="2">2 · INTERACTIONS</text><text x="24" y="79" fill="#fff" font-size="21" font-weight="700">Rules + constraints</text></g><g transform="translate(882 185)"><rect width="250" height="120" rx="19" fill="#14363a" stroke="#5edfd1"/><text x="24" y="40" fill="#71f5cc" font-size="14" letter-spacing="2">3 · MACRO PATTERN</text><text x="24" y="79" fill="#fff" font-size="21" font-weight="700">What emerges?</text></g><path d="M335 245H455M742 245H862" stroke="url(#g)" stroke-width="4" marker-end="url(#a)"/><g transform="translate(272 395)"><rect width="280" height="128" rx="20" fill="#0d2023" stroke="#355e62"/><text x="24" y="41" fill="#71f5cc" font-size="14" letter-spacing="2">4 · PREDICTIONS</text><text x="24" y="80" fill="#fff" font-size="21" font-weight="700">What changes it?</text><text x="24" y="105" fill="#a9bec1" font-size="15">Interventions + thresholds</text></g><g transform="translate(648 395)"><rect width="280" height="128" rx="20" fill="#0d2023" stroke="#355e62"/><text x="24" y="41" fill="#71f5cc" font-size="14" letter-spacing="2">5 · BREAKDOWN</text><text x="24" y="80" fill="#fff" font-size="21" font-weight="700">Where does it fail?</text><text x="24" y="105" fill="#a9bec1" font-size="15">Limits + competing models</text></g><path d="M1007 320V355H412V378M412 540V570H788V540" fill="none" stroke="#5edfd1" stroke-width="3" marker-end="url(#a)"/></g><rect x="68" y="610" width="1064" height="1" fill="#234448"/><text x="68" y="646" fill="#6e898c" font-family="system-ui,sans-serif" font-size="15">Life in the Simulation · original editorial diagram · conceptual, not a physical hierarchy</text></svg>