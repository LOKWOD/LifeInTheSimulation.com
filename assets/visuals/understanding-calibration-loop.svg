<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc"><title id="title">Understanding calibration loop</title><desc id="desc">A four-stage loop moves from a fluent explanation through explanation and prediction to revision, showing how confidence becomes calibrated by an external test.</desc><rect width="1200" height="620" rx="28" fill="#081417"/><defs><linearGradient id="g" x1="0" x2="1"><stop stop-color="#71f5cc"/><stop offset="1" stop-color="#4cc9ff"/></linearGradient><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0L10 3L0 6Z" fill="#5edfd1"/></marker></defs><text x="72" y="75" fill="#9bb2b6" font-family="system-ui,sans-serif" font-size="19" letter-spacing="5">UNDERSTANDING CALIBRATION LOOP</text><text x="72" y="116" fill="#effdf9" font-family="system-ui,sans-serif" font-size="28" font-weight="700">Ease is the starting signal. Contact with a result is the test.</text><g font-family="system-ui,sans-serif"><g transform="translate(72 195)"><rect width="220" height="150" rx="18" fill="#10282b" stroke="#27565a"/><text x="24" y="45" fill="#71f5cc" font-size="16" letter-spacing="3">01 · FLUENCY</text><text x="24" y="82" fill="#fff" font-size="25" font-weight="700">It feels clear.</text><text x="24" y="113" fill="#a9bec1" font-size="16">A cue, not a verdict.</text></g><g transform="translate(350 195)"><rect width="220" height="150" rx="18" fill="#10282b" stroke="#27565a"/><text x="24" y="45" fill="#71f5cc" font-size="16" letter-spacing="3">02 · EXPLAIN</text><text x="24" y="82" fill="#fff" font-size="25" font-weight="700">Open the box.</text><text x="24" y="113" fill="#a9bec1" font-size="16">Name causal steps.</text></g><g transform="translate(628 195)"><rect width="220" height="150" rx="18" fill="#10282b" stroke="#27565a"/><text x="24" y="45" fill="#71f5cc" font-size="16" letter-spacing="3">03 · PREDICT</text><text x="24" y="82" fill="#fff" font-size="25" font-weight="700">Test a result.</text><text x="24" y="113" fill="#a9bec1" font-size="16">Change one variable.</text></g><g transform="translate(906 195)"><rect width="220" height="150" rx="18" fill="#10282b" stroke="#27565a"/><text x="24" y="45" fill="#71f5cc" font-size="16" letter-spacing="3">04 · REVISE</text><text x="24" y="82" fill="#fff" font-size="25" font-weight="700">Meet the result.</text><text x="24" y="113" fill="#a9bec1" font-size="16">Update model + confidence.</text></g><path d="M292 270H338M570 270H616M848 270H894" stroke="url(#g)" stroke-width="4" marker-end="url(#a)"/><path d="M1016 365C1016 476 790 505 599 505C407 505 183 477 183 365" fill="none" stroke="#416d72" stroke-width="3" stroke-dasharray="9 9" marker-end="url(#a)"/><text x="600" y="474" text-anchor="middle" fill="#b7cecf" font-size="17">The loop returns with a narrower claim and better-calibrated confidence.</text></g><rect x="72" y="545" width="1054" height="1" fill="#234448"/><text x="72" y="580" fill="#6e898c" font-family="system-ui,sans-serif" font-size="15">Life in the Simulation · original editorial diagram · 2026</text></svg>