<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc"><title id="title">Memory reconstruction path</title><desc id="desc">An event passes through selective attention into incomplete stored traces. During retrieval, present cues, later information and learned structure contribute to a reconstructed memory report.</desc><rect width="1200" height="680" rx="28" fill="#081417"/><defs><linearGradient id="g" x1="0" x2="1"><stop stop-color="#71f5cc"/><stop offset="1" stop-color="#4cc9ff"/></linearGradient><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0L10 3L0 6Z" fill="#5edfd1"/></marker></defs><text x="68" y="65" fill="#9bb2b6" font-family="system-ui,sans-serif" font-size="18" letter-spacing="5">MEMORY RECONSTRUCTION PATH</text><text x="68" y="108" fill="#effdf9" font-family="system-ui,sans-serif" font-size="28" font-weight="700">Remembering is a present act constrained by surviving traces.</text><g font-family="system-ui,sans-serif"><g transform="translate(68 184)"><rect width="208" height="150" rx="18" fill="#10282b" stroke="#27565a"/><text x="22" y="42" fill="#71f5cc" font-size="15" letter-spacing="2">01 · EVENT</text><text x="22" y="82" fill="#fff" font-size="21" font-weight="700">Event details</text><text x="22" y="112" fill="#a9bec1" font-size="16">Some detail is lost.</text></g><g transform="translate(340 184)"><rect width="208" height="150" rx="18" fill="#10282b" stroke="#27565a"/><text x="22" y="42" fill="#71f5cc" font-size="15" letter-spacing="2">02 · ATTENTION</text><text x="22" y="82" fill="#fff" font-size="21" font-weight="700">Selective gate</text><text x="22" y="112" fill="#a9bec1" font-size="16">keeps some details.</text></g><g transform="translate(612 184)"><rect width="208" height="150" rx="18" fill="#10282b" stroke="#27565a"/><text x="22" y="42" fill="#71f5cc" font-size="15" letter-spacing="2">03 · TRACES</text><text x="22" y="82" fill="#fff" font-size="21" font-weight="700">Stored traces</text><text x="22" y="112" fill="#a9bec1" font-size="16">persists over time.</text></g><g transform="translate(884 184)"><rect width="248" height="150" rx="18" fill="#14363a" stroke="#5edfd1"/><text x="22" y="42" fill="#71f5cc" font-size="15" letter-spacing="2">04 · REPORT</text><text x="22" y="82" fill="#fff" font-size="21" font-weight="700">Memory report</text><text x="22" y="112" fill="#a9bec1" font-size="16">with confidence attached.</text></g><path d="" stroke="url(#g)" stroke-width="4" marker-end="url(#a)"/><g transform="translate(300 420)"><rect width="180" height="100" rx="16" fill="#0d2023" stroke="#355e62"/><text x="90" y="42" text-anchor="middle" fill="#b9d1d2" font-size="17">Present cues</text><text x="90" y="70" text-anchor="middle" fill="#789699" font-size="14">goals · mood · question</text></g><g transform="translate(510 420)"><rect width="180" height="100" rx="16" fill="#0d2023" stroke="#355e62"/><text x="90" y="42" text-anchor="middle" fill="#b9d1d2" font-size="17">Later information</text><text x="90" y="70" text-anchor="middle" fill="#789699" font-size="14">feedback · records</text></g><g transform="translate(720 420)"><rect width="180" height="100" rx="16" fill="#0d2023" stroke="#355e62"/><text x="90" y="42" text-anchor="middle" fill="#b9d1d2" font-size="17">Learned structure</text><text x="90" y="70" text-anchor="middle" fill="#789699" font-size="14">schemas · familiarity</text></g><path d="M390 420C455 366 690 360 928 337M600 420C650 378 790 366 960 337M810 420C842 383 910 360 995 337" fill="none" stroke="#416d72" stroke-width="3" stroke-dasharray="8 8" marker-end="url(#a)"/></g><rect x="68" y="592" width="1064" height="1" fill="#234448"/><text x="68" y="628" fill="#6e898c" font-family="system-ui,sans-serif" font-size="15">Life in the Simulation · original editorial diagram · reconstruction is not fabrication</text></svg>