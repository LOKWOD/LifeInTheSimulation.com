name: Publish generated Life in the Simulation site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: life-simulation-site-content
  cancel-in-progress: true

jobs:
  publish:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout latest source
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Assemble polished site
        run: |
          rm -rf _site
          mkdir -p _site
          cat .site-bundle/part-* | base64 --decode | tar -xz -C _site
          test -f _site/index.html
          echo "Prepared $(find _site -type f | wc -l) base site files"
      - name: Generate both expansion libraries
        run: |
          node scripts/generate-expansion.mjs _site
          node scripts/generate-expansion-two.mjs _site
          node scripts/publish-daily-2026-08-22.mjs _site
          node scripts/publish-daily-2026-08-23.mjs _site
          node scripts/publish-daily-2026-08-24.mjs _site
          node scripts/publish-daily-2026-08-25.mjs _site
          node scripts/publish-daily-2026-08-26.mjs _site
          node scripts/publish-daily-2026-08-27.mjs _site
          node scripts/publish-daily-2026-08-30.mjs _site
          node scripts/publish-daily-2026-08-31.mjs _site
          node scripts/publish-daily-2026-09-01.mjs _site
          node scripts/publish-daily-2026-09-02.mjs _site
          node scripts/publish-daily-2026-09-03.mjs _site
          node scripts/publish-daily-2026-09-04.mjs _site
      - name: Apply durable SEO, trust and discovery layer
        run: |
          cp assets/style.css _site/assets/style.css
          node scripts/optimize-seo.mjs _site
          python -m pip install --disable-pip-version-check --quiet Pillow==11.3.0
          python scripts/generate-social-cards.py _site
          node scripts/optimize-seo.mjs _site
      - name: Normalize and verify Cloudflare Web Analytics
        shell: python
        run: |
          from pathlib import Path
          import re

          token = "352a9195ed5342f9a8a9d244e13bddab"
          beacon = f'''<!-- Cloudflare Web Analytics --><script type='module' src='https://static.cloudflareinsights.com/beacon.min.js' data-cf-beacon='{{"token": "{token}"}}'></script><!-- End Cloudflare Web Analytics -->'''
          pattern = re.compile(r"(?:<!--\s*Cloudflare Web Analytics\s*-->)?\s*<script\b[^>]*\bsrc=[\"']https://static\.cloudflareinsights\.com/beacon\.min\.js[\"'][^>]*></script>\s*(?:<!--\s*End Cloudflare Web Analytics\s*-->)?", re.I)
          html_files = list(Path("_site").rglob("*.html"))
          if not html_files:
              raise SystemExit("No HTML files found in _site")
          for path in html_files:
              html = path.read_text(encoding="utf-8")
              if "</body>" not in html.lower():
                  raise SystemExit(f"Missing </body> in {path}")
              analytics_count = html.count("static.cloudflareinsights.com/beacon.min.js")
              if analytics_count != 1 or token not in html:
                  html = pattern.sub("", html)
                  html = re.sub(r"</body>", beacon + "\n</body>", html, count=1, flags=re.I)
                  path.write_text(html, encoding="utf-8")
              if html.count("static.cloudflareinsights.com/beacon.min.js") != 1 or token not in html:
                  raise SystemExit(f"Analytics verification failed for {path}")
          print(f"Cloudflare Web Analytics verified on {len(html_files)} HTML pages")
      - name: Inject website visitor light beacon
        run: node scripts/inject-visitor-beacon.mjs _site life-in-the-simulation
      - name: Audit generated publication
        run: |
          node scripts/audit-daily-publication.mjs _site
      - name: Install generated publication into main
        run: |
          cp -a _site/. .
          rm -rf _site
      - name: Commit generated publication
        run: |
          if git diff --quiet && git diff --cached --quiet; then
            echo "Generated publication is already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Publish verified Life in the Simulation site"
          git pull --rebase origin main
          git push origin HEAD:main
