name: Deploy Life in the Simulation

on:
  push:
    branches: [main]
  workflow_run:
    workflows: ["pages build and deployment"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: polished-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout latest site package
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Assemble polished site
        run: |
          mkdir -p _site
          cat .site-bundle/part-* | base64 --decode | tar -xz -C _site
          test -f _site/index.html
          echo "Prepared $(find _site -type f | wc -l) site files"

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Let the branch publisher finish first
        if: github.event_name == 'push'
        run: sleep 45

      - name: Deploy polished site
        id: deployment
        uses: actions/deploy-pages@v4
